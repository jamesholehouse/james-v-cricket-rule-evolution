<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cricket Laws: label review</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--line:#ddddd5;--card:#fff;--acc:#1f5f8b;--add:#cfeacb;--del:#f5cccc}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--fg:#e8e8e2;--mut:#9a9a92;--line:#3a3a35;--card:#222220;--acc:#6fb1de;--add:#27502a;--del:#612a2a}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;height:100vh}
#side{width:420px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
#filters{padding:8px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px}
#filters input,#filters select{width:100%;padding:4px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:4px}
#filters input[type=text]{grid-column:1/3}
#prog{padding:4px 8px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line)}
#list{overflow:auto;flex:1}
.row{padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--card)}.row.sel{background:var(--card);border-left:3px solid var(--acc)}
.row .id{font-size:12px;color:var(--mut)}.row .w{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:8px;border:1px solid var(--line);margin-right:3px}
.s-confirmed{background:var(--add)}.s-rejected{background:var(--del)}.s-edited,.s-needs_research{background:#f1e6b3;color:#222}
#main{flex:1;overflow:auto;padding:16px 24px;min-width:0}
h2{margin:0 0 4px;font-size:18px}h3{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec .meta{font-size:11px;color:var(--mut);margin-bottom:4px}
ins{background:var(--add);text-decoration:none}del{background:var(--del)}
.txt{white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:120px 1fr;gap:2px 10px}.kv div:nth-child(odd){color:var(--mut)}
button{padding:6px 12px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button:hover{filter:brightness(.95)}
textarea{width:100%;min-height:60px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px}
#bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);margin-top:16px}
small{color:var(--mut)}@media(max-width:800px){body{flex-direction:column;height:auto}#side{width:100%;height:40vh}.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="side">
 <div id="filters">
  <input type="text" id="q" placeholder="search text, law, event id">
  <select id="pair"></select><select id="category"></select>
  <select id="status"></select><select id="basis"><option value="">any basis</option><option>stated</option><option>attributed</option><option>inferred</option><option>conjecture</option><option>derived</option><option>none</option></select>
  <select id="confidence"><option value="">any confidence</option><option>high</option><option>medium</option><option>low</option></select>
  <label><input type="checkbox" id="substantive"> substantive only</label>
  <label><input type="checkbox" id="suspect"> integrity: suspect</label>
 </div>
 <div id="prog"></div><div id="list"></div>
</div>
<div id="main"><p>Select an event. Keys: <b>j/k</b> next/previous, <b>c</b> confirm, <b>x</b> reject, <b>r</b> needs research, <b>e</b> edited (focus note).</p></div>
<script>
const $=s=>document.querySelector(s);let events=[],cur=null,det=null;
const esc=s=>(s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function api(u,o){const r=await fetch(u,o);return r.json()}
function diff(a,b){const x=(a||"").split(/(\s+)/),y=(b||"").split(/(\s+)/),n=x.length,m=y.length;
 if(n*m>4e6)return[esc(a),esc(b)];
 const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 let i=0,j=0,A="",B="";
 while(i<n&&j<m){if(x[i]===y[j]){A+=esc(x[i]);B+=esc(y[j]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){A+="<del>"+esc(x[i])+"</del>";i++}else{B+="<ins>"+esc(y[j])+"</ins>";j++}}
 while(i<n)A+="<del>"+esc(x[i++])+"</del>";while(j<m)B+="<ins>"+esc(y[j++])+"</ins>";return[A,B]}
async function init(){const m=await api("/api/meta");
 $("#pair").innerHTML='<option value="">all pairs</option>'+m.pairs.map(p=>`<option>${p}</option>`).join("");
 $("#category").innerHTML='<option value="">all categories</option>'+m.categories.map(p=>`<option>${p}</option>`).join("");
 $("#status").innerHTML='<option value="">any status</option>'+m.statuses.map(p=>`<option>${p}</option>`).join("");
 for(const id of["q","pair","category","status","basis","confidence","substantive","suspect"])$("#"+id).addEventListener("input",load);
 const h=location.hash.slice(1);await load();if(h)open(h)}
async function load(){const p=new URLSearchParams();
 for(const id of["q","pair","category","status","basis","confidence"])if($("#"+id).value)p.set(id,$("#"+id).value);
 if($("#substantive").checked)p.set("substantive","1");if($("#suspect").checked)p.set("suspect","1");
 const r=await api("/api/events?"+p);events=r.events;const b=r.stats.by_status;
 $("#prog").textContent=`${events.length} shown · ${r.stats.total-(b.unreviewed||0)}/${r.stats.total} reviewed (`+Object.entries(b).map(([k,v])=>k+" "+v).join(", ")+")";
 renderList()}
function renderList(){$("#list").innerHTML=events.map(e=>`<div class="row ${e.event_id===cur?"sel":""}" data-id="${e.event_id}"><div class="id">${e.event_id} · ${esc(e.law)} <span class="tag s-${e.status}">${e.status}</span></div><div><span class="tag">${e.category}</span><span class="tag">${e.basis}</span><span class="tag">${e.confidence}</span>${e.semantic==="1"?'<span class="tag">semantic</span>':""}${e.edition_issue==="1"?'<span class="tag">edition</span>':""}</div><div class="w">${esc(e.what)}</div></div>`).join("");
 document.querySelectorAll(".row").forEach(r=>r.onclick=()=>open(r.dataset.id))}
async function open(id){cur=id;location.hash=id;det=await api("/api/event?id="+encodeURIComponent(id));renderList();const l=det.label,v=det.verdict;
 const recs=det.records.map(c=>{if(c.op==="renumber")return`<div class="card rec"><div class="meta">${c.change_id} · renumber · ${esc(c.section)}</div>Law <b>${esc(c.law_from)}</b> → Law <b>${esc(c.law_to)}</b> · text identical (no old/new wording to compare). Check the Law's text in the two editions if in doubt.</div>`;const[a,b]=diff(c.old_text,c.new_text);return`<div class="card rec"><div class="meta">${c.change_id} · ${c.op} · ${c.granularity} · ${esc(c.section)} · Law ${esc(c.law_from)}→${esc(c.law_to)}${c.similarity?" · sim "+c.similarity:""}</div><div class="grid"><div class="txt">${c.old_text?a:"<small>(none)</small>"}</div><div class="txt">${c.new_text?b:"<small>(none)</small>"}</div></div></div>`}).join("");
 const src=det.sources.map(s=>`<div class="card"><b>${s.id}</b> ${esc(s.title)}<br><small>${esc(s.publisher_or_author)} · ${esc(s.date)} · ${esc(s.type)}</small><br><small>${esc(s.reliability_note)}</small>${s.url_or_path&&s.url_or_path.startsWith("http")?`<br><a href="${esc(s.url_or_path)}" target="_blank" rel="noopener">source link</a>`:""}</div>`).join("");
 const gold=det.gold.map(g=>`<div class="card"><b>Rait Kerr serial ${g.serial}</b> (${esc(g.date)}, section ${esc(g.section)}, p.${esc(g.page)})<br>${esc(g.particulars)}</div>`).join("");
 const flags=["semantic_only","scope_change","source_edition_issue","substantive_change"].map(k=>`${k}=${l[k]}`).join(" · ");
 $("#main").innerHTML=`<h2>${l.event_id}</h2><small>${esc(l.law_title||l.canonical_law)} · Law ${esc(l.law_from)}→${esc(l.law_to)} · ${l.n_records} records · ${esc(l.event_type)}</small>
 <h3>Label</h3><div class="card"><div class="kv"><div>Category</div><div><b>${l.category}</b> / ${l.subtype}${l.secondary_category?` (secondary ${l.secondary_category}/${l.secondary_subtype})`:""}</div><div>Confidence · basis</div><div>${l.confidence} · ${l.basis}</div><div>Integrity</div><div>${l.integrity}</div><div>Flags</div><div>${flags}</div><div>Dating</div><div>${esc(l.date_evidence)}</div><div>Label source</div><div>${esc(l.label_ref)}</div></div></div>
 <div class="card"><b>What changed</b><div class="txt">${esc(l.what_changed)}</div></div><div class="card"><b>Rationale</b><div class="txt">${esc(l.rationale)}</div></div>${l.notes?`<div class="card"><b>Notes</b><div class="txt">${esc(l.notes)}</div></div>`:""}
 <h3>Evidence (${det.sources.length})</h3>${src||"<small>none cited</small>"}${gold?"<h3>Rait Kerr entries named in the label</h3>"+gold:""}
 <h3>Old text (left) vs new text (right), ${det.records.length} records</h3>${recs}
 <div id="bar"><div>Current verdict: <b>${v?v.status:"unreviewed"}</b> ${v?`<small>(${v.time})</small>`:""}</div>
 <textarea id="note" placeholder="Reviewer note: what is wrong / what you checked">${esc(v?v.note:"")}</textarea>
 <div class="grid" style="margin:6px 0"><input id="pc" placeholder="proposed category (if edited)" value="${esc(v?v.proposed_category:"")}"><input id="ps" placeholder="proposed subtype" value="${esc(v?v.proposed_subtype:"")}"></div>
 <button class="p" onclick="send('confirmed')">Confirm (c)</button> <button onclick="send('edited')">Edited (e)</button> <button onclick="send('rejected')">Reject (x)</button> <button onclick="send('needs_research')">Needs research (r)</button> <button onclick="send('unreviewed')">Clear</button></div>`;
 $("#main").scrollTop=0}
async function send(status){if(!cur)return;await api("/api/verdict",{method:"POST",body:JSON.stringify({event_id:cur,status,note:$("#note").value,proposed_category:$("#pc").value,proposed_subtype:$("#ps").value})});
 const e=events.find(x=>x.event_id===cur);if(e)e.status=status;const keep=$("#main").scrollTop;await load();await open(cur);$("#main").scrollTop=keep;if(status!=="unreviewed"&&status!=="edited")step(1)}
function step(d){const i=events.findIndex(e=>e.event_id===cur);const n=events[Math.max(0,Math.min(events.length-1,i+d))];if(n)open(n.event_id)}
document.addEventListener("keydown",ev=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 ({j:()=>step(1),k:()=>step(-1),c:()=>send("confirmed"),x:()=>send("rejected"),r:()=>send("needs_research"),e:()=>$("#note").focus()})[ev.key]?.();});
init();
</script></body></html>
